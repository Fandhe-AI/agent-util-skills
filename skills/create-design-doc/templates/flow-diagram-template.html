<!doctype html>
<!--
  画面遷移図テンプレート。アクター別レーンに分けた HTML + inline SVG。
  実際の画面遷移図を作る際は本ファイルをコピーし、レーン数・ノード・エッジ・凡例を
  対象アイデアの実際の画面構成に置き換える。外部 CDN・外部フォントは使用しないこと。
  Playwright で PNG 化する: scripts/capture_screenshot.py --html <this> --out flow.png --full-page
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>画面遷移図</title>
<style>
  :root {
    --color-bg: #ffffff;
    --color-fg: #1c1c1c;
    --color-lane-bg: #f4f6f8;
    --color-lane-border: #d8dee6;
    --color-node-bg: #ffffff;
    --color-node-border: #1f3a93;
    --flow-primary: #1f3a93;   /* 主要フロー */
    --flow-alt: #e08e45;       /* 代替・分岐フロー */
    --flow-error: #c0392b;     /* エラー・離脱フロー */
    --space-md: 16px;
    --font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
  }
  body {
    margin: 0;
    padding: var(--space-md);
    background: var(--color-bg);
    color: var(--color-fg);
    font-family: var(--font-family);
  }
  h1 { font-size: 18px; margin: 0 0 var(--space-md); }
  .lanes {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .lane {
    display: flex;
    align-items: center;
    background: var(--color-lane-bg);
    border: 1px solid var(--color-lane-border);
    border-radius: 8px;
    padding: 12px;
  }
  .lane-label {
    width: 120px;
    flex-shrink: 0;
    font-weight: bold;
    font-size: 13px;
  }
  .lane-nodes {
    display: flex;
    gap: 24px;
    overflow-x: auto;
  }
  .node {
    min-width: 140px;
    background: var(--color-node-bg);
    border: 2px solid var(--color-node-border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    text-align: center;
    white-space: nowrap;
  }
  .legend {
    margin-top: var(--space-md);
    display: flex;
    gap: 16px;
    font-size: 12px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 20px; height: 3px; display: inline-block; }
</style>
</head>
<body>
  <h1>画面遷移図（サンプル。実際のアクター・画面に置き換えること）</h1>
  <div class="lanes">
    <div class="lane">
      <div class="lane-label">ユーザー</div>
      <div class="lane-nodes">
        <div class="node">画面A: 起点</div>
        <div class="node">画面B: 一覧</div>
        <div class="node">画面C: 詳細</div>
      </div>
    </div>
    <div class="lane">
      <div class="lane-label">システム</div>
      <div class="lane-nodes">
        <div class="node">API: 一覧取得</div>
        <div class="node">API: 詳細取得</div>
      </div>
    </div>
  </div>

  <svg width="100%" height="120" role="img" aria-label="画面間の遷移を示す矢印">
    <title>遷移フロー</title>
    <desc>画面Aから画面Bへ主要フロー、画面Bから画面Cへ主要フロー、画面Bからエラー時の離脱フローを示す</desc>
    <line x1="80" y1="20" x2="260" y2="20" stroke="var(--flow-primary)" stroke-width="2" marker-end="url(#arrow-primary)" />
    <line x1="80" y1="60" x2="260" y2="60" stroke="var(--flow-alt)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-alt)" />
    <defs>
      <marker id="arrow-primary" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="var(--flow-primary)" />
      </marker>
      <marker id="arrow-alt" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="var(--flow-alt)" />
      </marker>
    </defs>
  </svg>

  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background: var(--flow-primary);"></span>主要フロー</div>
    <div class="legend-item"><span class="legend-swatch" style="background: var(--flow-alt); border-top: 2px dashed var(--flow-alt); height: 0;"></span>代替・分岐フロー</div>
    <div class="legend-item"><span class="legend-swatch" style="background: var(--flow-error);"></span>エラー・離脱フロー</div>
  </div>
</body>
</html>
