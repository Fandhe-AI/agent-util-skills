name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # スキル構造検証（依存なし・全 PR / push 共通）
  # --------------------------------------------------
  # 各 skills/<name>/SKILL.md の frontmatter (name / description / user-invocable)、
  # name とディレクトリ名の一致、skills-lock.json の JSON 妥当性を bash で検証する。
  structure:
    name: Skill structure check
    runs-on: ubuntu-latest
    # bash + grep のみの軽量ジョブ。hang 検知の保険として 5 分で打ち切る。
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Validate skill structure
        run: bash .github/scripts/check-skill-structure.sh

  # --------------------------------------------------
  # skill-tests（各スキルの node:test 回帰テストと Python unittest）
  # --------------------------------------------------
  # skills/*/tests/**/*.test.mjs を node:test で、skills/*/tests/test_*.py を
  # unittest discover で実行する。ubuntu-latest には Node.js が
  # 同梱されるため setup-node の追加（新規 action の SHA 固定管理）は不要。
  # 対象: skills/setup-firebase-hosting/tests/version-pin.test.mjs（Issue
  # #393）・key-deletion-authority.test.mjs（Issue #3）等。手動実行前提
  # だったこれらのテストを CI で恒久実行する。
  skill-tests:
    # 表示名は ruleset の required context に束縛されているため据え置く
    # （変えると required が Expected のまま残り全 PR がマージ不能になる）。
    # 名前は node:test だが Python の unittest もこのジョブで実行する。
    name: Skill tests (node:test)
    runs-on: ubuntu-latest
    # node:test は静的ファイル検査と shim による挙動テストで軽量。Python の
    # unittest（setup-github-pages が約 110 秒）を含め 5 分打ち切りで足りるかは
    # PR の CI で実測し、3 分を超えたら引き上げる。
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Run node:test
        # `shopt -s failglob` で skills/*/tests/**/*.test.mjs が1件もマッチしない場合に
        # シェルを即座にエラー終了させる。failglob なしだとグロブがマッチしない場合
        # 展開されずリテラル文字列のまま node --test に渡り、node は該当ファイルを
        # 発見できず 0 tests / 0 pass / 0 fail・終了コード0 で「成功」してしまう
        # （鍵削除回帰テスト等の安全機構を守るゲート自体が無自覚に無効化される
        # fail-open。Issue #3 レビュー指摘）。globstar で tests/ 配下の
        # サブディレクトリも再帰探索する（`**` は 0 階層にもマッチするため
        # tests/ 直下も引き続き対象。agent-cli-skills#447 の横展開）。
        run: |
          shopt -s globstar failglob
          node --test skills/*/tests/**/*.test.mjs

      - name: Run Python unittest
        # node:test が失敗しても Python を実行する（ジョブ全体は失敗のまま）。
        # ブリッジ（.test.mjs）経由をやめ discover で直接実行するため、失敗した
        # テストケース名が CI ログにそのまま出て、test_*.py の登録漏れも起きない。
        # ResourceWarning はファイルの閉じ忘れの回帰ガード（Issue #144）。
        # 1 件もマッチしない場合・tests 直下以外の test_*.py（discover されない）
        # はいずれも失敗にする（fail-closed）。setup-python は使わず runner 同梱の
        # python3 を使う。
        if: ${{ !cancelled() }}
        run: |
          set -u
          shopt -s failglob
          files=(skills/*/tests/test_*.py)
          shopt -u failglob
          shopt -s globstar nullglob
          nested=(skills/*/tests/*/**/test_*.py)
          if [ "${#nested[@]}" -gt 0 ]; then
            printf '::error::tests 直下以外の test_*.py は discover されない: %s\n' "${nested[@]}"
            exit 1
          fi
          python3 --version
          mapfile -t dirs < <(printf '%s\n' "${files[@]%/*}" | sort -u)
          failed=()
          for d in "${dirs[@]}"; do
            echo "::group::${d}"
            err="$(mktemp "${RUNNER_TEMP}/unittest-stderr.XXXXXX")"
            rc=0
            python3 -I -B -m unittest discover -s "${d}" -t "${d}" -p 'test_*.py' -v 2> "${err}" || rc=$?
            cat "${err}" >&2
            if grep -q 'ResourceWarning' "${err}"; then
              echo "::error::${d}: ResourceWarning を検出（ファイルを with で閉じる。Issue #144）"
              rc=1
            fi
            rm -f -- "${err}"
            echo "::endgroup::"
            [ "${rc}" -eq 0 ] || failed+=("${d} (exit ${rc})")
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::Python unittest 失敗: %s\n' "${failed[@]}"
            exit 1
          fi

  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint）
  # --------------------------------------------------
  # Fandhe-AI/actions の lint-docs reusable workflow（lint ツールバージョンは共通側で
  # 固定）を呼び出す薄い wrapper。markdownlint の設定は `.markdownlint.jsonc`、除外は
  # `.markdownlintignore`、その他はそれぞれ `.editorconfig` / `.yamllint` /
  # `commitlint.config.mjs` を参照する。structure 等リポジトリ固有ジョブは個別実装。
  lint-docs:
    uses: Fandhe-AI/actions/.github/workflows/lint-docs.yml@latest
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（組織 runner 方針）
      runner-label: ubuntu-latest
      markdownlint: true
      editorconfig: true
      yamllint: true
      # commitlint は PR の base/head から commit 範囲を取るため pull_request 専用
      # （reusable 側は他イベントを fail-closed で拒否する）。push でも動く本
      # workflow では event で切り替え、main への push では実行しない
      commitlint: ${{ github.event_name == 'pull_request' }}
